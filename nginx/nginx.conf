# nginx/nginx.conf

# Formato de log que deja ver a QUÉ backend fue cada petición.
# Sin esto, el log solo muestra la ruta y la evidencia #3 no prueba nada.
log_format strangler '$remote_addr - [$time_local] "$request" '
                     'status=$status -> upstream=$upstream_addr';

upstream django_v1 {
    server web:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;
    client_max_body_size 10M;
    access_log /var/log/nginx/access.log strangler;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Estáticos: los sirve Nginx (viene del Taller 05)
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # RUTA NUEVA: estrangulamos la compra y la mandamos a Flask.
    # Al ser el prefijo más largo, gana sobre 'location /'.
    location /api/v2/comprar {
        add_header X-Served-By "flask-v2" always;
        proxy_pass http://flask_v2;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # TODO LO DEMÁS sigue yendo al monolito: la API v1, el inventario
    # en '/', las vistas HTML. Esta es la clave del Strangler Pattern:
    # el monolito sigue atendiendo todo lo que aún no se ha migrado.
    location / {
        add_header X-Served-By "django-v1" always;
        proxy_pass http://django_v1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}