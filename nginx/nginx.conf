# nginx/nginx.conf

# 1. Backend: Django + Gunicorn. 'web' es el nombre del servicio en docker-compose.
upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 10M;

    location = /favicon.ico { access_log off; log_not_found off; }

    # 2. Archivos estáticos: los sirve Nginx directamente, sin molestar a Django.
    #    Esta es la razón de ser de un proxy inverso delante de un WSGI.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # 3. Proxy inverso: todo lo demás va al backend
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Nota arquitectónica: aquí irá en el futuro un 'location /api/v2/'
    # apuntando al microservicio Flask, para ejecutar el Strangler Pattern.
}