services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:                                    # El monolito (v1)
    build: .
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_ALLOWED_HOSTS=*
      - PAYMENT_PROVIDER=BANCO

  pagos_flask:                            # El microservicio (v2) - EL ESTRANGULADOR
    build: ./microservicio_pagos
    # Sin 'ports': igual que Django, solo accesible por la red interna.
    # Lo probamos a través de Nginx o con 'docker compose exec'.

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
      - pagos_flask

volumes:
  postgres_data:
  static_volume: